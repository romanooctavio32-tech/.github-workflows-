name: Compilar APK Automático

on:
  push:
    branches: [ "main" ] # Se ejecuta cada vez que subes código a la rama main
  workflow_dispatch: # Permite ejecutar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar el SDK de Android
      uses: android-actions/setup-android@v3

    - name: Dar permisos de ejecución al compilador Gradle
      run: chmod +x gradlew

    - name: Compilar APK en modo Debug
      run: ./gradlew assembleDebug

    - name: Guardar el archivo APK para descargar
      uses: actions/upload-artifact@v4
      with:
        name: apk-amplificador
        path: app/build/outputs/apk/debug/app-debug.apk
